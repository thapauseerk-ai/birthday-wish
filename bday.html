<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #a8d1ff 0%, #c3a6ff 40%, #a8d1ff 70%, #9d72ff 100%);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #confettiCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        /* Music Control Button - Top Right */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            color: #1e3a5f;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 100;
            transition: all 0.2s;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .music-control:hover {
            background: #1e3a5f;
            color: white;
            transform: scale(1.02);
        }

        .card-custom {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 50px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #1e3a5f;
            margin-bottom: 20px;
        }

        /* ========== THE LUXURY SHINY CAKE ========== */
        .cake-container {
            display: flex;
            justify-content: center;
            margin: 40px 0;
        }

        .cake {
            position: relative;
            width: 300px;
            height: 250px;
        }

        .shiny-tier {
            position: absolute;
            box-shadow: inset -15px 0 30px rgba(255,255,255,0.3), inset 10px 0 20px rgba(0,0,0,0.1);
        }

        /* Tiers with Rounded Top Corners */
        .tier-bottom {
            bottom: 0;
            width: 240px;
            height: 110px;
            border-radius: 40px 40px 8px 8px;
            left: 30px;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b8860b, #ddac17);
            z-index: 2;
        }

        .tier-top {
            bottom: 105px;
            width: 170px;
            height: 95px;
            border-radius: 35px 35px 8px 8px;
            left: 65px;
            background: linear-gradient(135deg, #4a7ab5, #6a9ad5, #3a6aa5);
            z-index: 4;
        }

        /* Rounded Drip styling */
        .drip-line {
            position: absolute;
            top: 0; left: 0; width: 100%;
            z-index: 7;
        }

        .tier-top .drip-line { 
            background: #d4af37; 
            height: 14px; 
            border-radius: 35px 35px 0 0;
        } 
        
        .tier-bottom .drip-line { 
            background: #4a7ab5; 
            height: 10px; 
            border-radius: 40px 40px 0 0;
        }

        .drip { position: absolute; border-radius: 0 0 15px 15px; z-index: 6; }
        .top-gold { background: #d4af37; width: 14px; } 
        .bot-blue { background: #4a7ab5; width: 12px; }

        .connector {
            position: absolute;
            top: -12px;
            width: 8px;
            background: #4a7ab5;
            border-radius: 10px;
            z-index: 5;
        }

        /* ========== WHITE & GOLD CANDLES ========== */
        .candles {
            position: absolute;
            bottom: 195px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .candle {
            position: relative;
            width: 12px;
            height: 48px;
            background: repeating-linear-gradient(
                45deg,
                #ffffff,
                #ffffff 8px,
                #d4af37 8px,
                #d4af37 16px
            );
            border-radius: 4px;
            box-shadow: 1px 2px 5px rgba(0,0,0,0.1);
        }

        .flame {
            position: absolute;
            top: -24px; left: 50%; transform: translateX(-50%);
            width: 16px; height: 24px;
            background: radial-gradient(circle at 50% 80%, #fff, #ffcc33, #ff6600);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ffaa33;
            animation: flicker 0.1s infinite alternate;
        }

        @keyframes flicker { 
            0% { transform: translateX(-50%) scale(1); } 
            100% { transform: translateX(-50%) scale(1.15); } 
        }
        
        .candle.out .flame { display: none; }

        .hint { 
            color: #1e3a5f; 
            font-weight: 600; 
            font-size: 1rem; 
            margin-top: 20px; 
            opacity: 0.8;
        }

        /* Gift Icon */
        .gift-link {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .gift-link:hover {
            transform: scale(1.1);
        }
        .gift-emoji {
            font-size: 4rem;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.15));
        }
        .gift-text {
            font-size: 0.8rem;
            color: #1e3a5f;
            margin-top: 5px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<!-- Music Control Button -->
<button class="music-control" id="musicToggleBtn">
    🎵 Stop Music
</button>

<div class="card-custom">
    <h1>Happy Birthday, Vivan!🎂❤️</h1>
    
    <div class="cake-container">
        <div class="cake">
            <!-- Bottom Tier (Gold) -->
            <div class="shiny-tier tier-bottom">
                <div class="drip-line"></div>
                <div class="drip bot-blue" style="left: 0; height: 45px;"></div>
                <div class="drip bot-blue" style="right: 0; height: 45px;"></div>
                <div class="drip bot-blue" style="left: 35px; height: 35px;"></div>
                <div class="drip bot-blue" style="left: 70px; height: 60px;"></div>
                <div class="drip bot-blue" style="left: 105px; height: 30px;"></div>
                <div class="drip bot-blue" style="left: 140px; height: 65px;"></div>
                <div class="drip bot-blue" style="left: 175px; height: 40px;"></div>
                <div class="drip bot-blue" style="left: 205px; height: 50px;"></div>
                
                <div class="connector" style="left: 45px; height: 22px;"></div>
                <div class="connector" style="right: 45px; height: 28px;"></div>
            </div>

            <!-- Top Tier (Blue) -->
            <div class="shiny-tier tier-top">
                <div class="drip-line"></div>
                <div class="drip top-gold" style="left: 0; height: 38px;"></div>
                <div class="drip top-gold" style="right: 0; height: 38px;"></div>
                <div class="drip top-gold" style="left: 30px; height: 48px;"></div>
                <div class="top-gold drip" style="left: 60px; height: 28px;"></div>
                <div class="top-gold drip" style="left: 85px; height: 75px;"></div>
                <div class="top-gold drip" style="left: 110px; height: 28px;"></div>
                <div class="top-gold drip" style="left: 135px; height: 48px;"></div>
            </div>

            <div class="candles" id="candlesContainer">
                <div class="candle" id="candle1"><div class="flame"></div></div>
                <div class="candle" id="candle2"><div class="flame"></div></div>
                <div class="candle" id="candle3"><div class="flame"></div></div>
            </div>
        </div>
    </div>

    <div class="hint" id="hintText">Press any key to blow the candles!</div>

    <!-- Gift Icon -->
    <a href="gift.html" class="gift-link">
        <div class="gift-emoji">🎁</div>
        <div class="gift-text">✨ Made with Love ✨</div>
    </a>
</div>

<script>
    // ==================== CONFETTI ====================
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const colors = ['#d4af37', '#ffffff', '#e0f0ff', '#4a7ab5'];

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * -canvas.height;
            this.size = Math.random() * 7 + 2;
            this.speedY = Math.random() * 1.5 + 0.5; 
            this.speedX = (Math.random() - 0.5) * 1.2;
            this.color = colors[Math.floor(Math.random() * colors.length)];
            this.rotation = Math.random() * 360;
        }
        update() { this.y += this.speedY; this.x += this.speedX; this.rotation += 1; }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation * Math.PI / 180);
            ctx.fillStyle = this.color;
            ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
            ctx.restore();
        }
    }

    function animate() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        particles.forEach((p, i) => {
            p.update(); p.draw();
            if(p.y > canvas.height) particles.splice(i, 1);
        });
        requestAnimationFrame(animate);
    }
    animate();

    // ==================== MUSIC SYSTEM ====================
    let bgMusic = null;
    let musicPlaying = false;
    
    function initMusic() {
        if (bgMusic) return;
        bgMusic = new Audio('birthday-music.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.4;
    }
    
    function autoPlayMusic() {
        initMusic();
        if (bgMusic) {
            bgMusic.play().then(() => {
                musicPlaying = true;
                document.getElementById('musicToggleBtn').innerHTML = '🎵 Stop Music';
            }).catch(e => {
                console.log('Autoplay blocked. Click anywhere or press a key to start music.');
                document.getElementById('musicToggleBtn').innerHTML = '🎵 Play Music';
            });
        }
    }
    
    autoPlayMusic();
    
    // ==================== BLOW CANDLES LOGIC ====================
    let blown = false;
    
    window.addEventListener('keydown', () => {
        if(blown) return;
        blown = true;
        document.getElementById('hintText').innerHTML = " <b>Happy birthday, pookiee!</b> 🎂🎉❤️";
        
        document.querySelectorAll('.flame').forEach(f => f.style.opacity = '0');
        document.querySelectorAll('.candle').forEach(c => c.classList.add('out'));
        
        for(let i=0; i<500; i++) particles.push(new Particle());
        
        if (bgMusic && bgMusic.paused) {
            bgMusic.play().catch(e => console.log(e));
            musicPlaying = true;
            document.getElementById('musicToggleBtn').innerHTML = '🎵 Stop Music';
        }
    });
    
    // ==================== MUSIC TOGGLE BUTTON ====================
    const musicBtn = document.getElementById('musicToggleBtn');
    musicBtn.addEventListener('click', () => {
        if (!bgMusic) {
            initMusic();
        }
        if (bgMusic && !bgMusic.paused) {
            bgMusic.pause();
            musicPlaying = false;
            musicBtn.innerHTML = '🎵 Play Music';
        } else if (bgMusic && bgMusic.paused) {
            bgMusic.play();
            musicPlaying = true;
            musicBtn.innerHTML = '🎵 Stop Music';
        }
    });
</script>
</body>
</html>
